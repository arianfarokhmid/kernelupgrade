---
- name: Build and Install Linux Kernel from Source
  hosts: all
  become: yes
  vars:
    kernel_version: "7.0.3"
    major_version: "{{ kernel_version.split('.')[0] }}"
    kernel_url: "https://cdn.kernel.org/pub/linux/kernel/v{{ major_version }}.x/linux-{{ kernel_version }}.tar.xz"
    build_dir: "/home/{{ ansible_user_id }}/kernel_build"
    kernel_src_dir: "{{ build_dir }}/linux-{{ kernel_version }}"
    threads: "{{ ansible_processor_vcpus }}"

  tasks:
    - name: Install build dependencies (Debian/Ubuntu)
      apt:
        pkg:
          - build-essential
          - flex
          - bison
          - libncurses-dev
          - libssl-dev
          - libelf-dev
          - libdw-dev
          - libdwarf-dev
          - dwarves
          - pahole
          - xz-utils
          - wget
          - bc
          - gawk
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Create build directory
      file:
        path: "{{ build_dir }}"
        state: directory
        mode: '0755'

    - name: Download Kernel source tarball
      get_url:
        url: "{{ kernel_url }}"
        dest: "{{ build_dir }}/linux-{{ kernel_version }}.tar.xz"
        timeout: 300

    - name: Extract Kernel source
      unarchive:
        src: "{{ build_dir }}/linux-{{ kernel_version }}.tar.xz"
        dest: "{{ build_dir }}"
        remote_src: yes
        creates: "{{ kernel_src_dir }}/Makefile"

    - name: Copy current system kernel config
      copy:
        src: "/boot/config-{{ ansible_kernel }}"
        dest: "{{ kernel_src_dir }}/.config"
        remote_src: yes

    # ------------------------------------------------
    # FIX: Remove Debian Canonical cert references
    # ------------------------------------------------
    
    - name: Remove Debian Canonical certificate reference
      replace:
        path: "{{ kernel_src_dir }}/.config"
        regexp: 'debian/canonical-certs.pem'
        replace: ''

    - name: Disable system trusted keys
      lineinfile:
        path: "{{ kernel_src_dir }}/.config"
        regexp: '^CONFIG_SYSTEM_TRUSTED_KEYS='
        line: 'CONFIG_SYSTEM_TRUSTED_KEYS=""'

    - name: Disable system revocation keys
      lineinfile:
        path: "{{ kernel_src_dir }}/.config"
        regexp: '^CONFIG_SYSTEM_REVOCATION_KEYS='
        line: 'CONFIG_SYSTEM_REVOCATION_KEYS=""'

    - name: Disable module signature enforcement
      lineinfile:
        path: "{{ kernel_src_dir }}/.config"
        regexp: '^CONFIG_MODULE_SIG='
        line: 'CONFIG_MODULE_SIG=n'

    - name: Run olddefconfig (Accept defaults for new options)
      command: make olddefconfig
      args:
        chdir: "{{ kernel_src_dir }}"

    - name: Build Kernel and Modules (This may take time)
      command: "make -j{{ threads }}"
      args:
        chdir: "{{ kernel_src_dir }}"
      async: 7200 
      poll: 60    

    - name: Install Kernel Modules
      command: make modules_install
      args:
        chdir: "{{ kernel_src_dir }}"

    - name: Install Kernel
      command: make install
      args:
        chdir: "{{ kernel_src_dir }}"
      notify: Update Grub

    # ------------------------------------------------
    # Configure initramfs with MODULES=dep and xz compression
    # ------------------------------------------------

    - name: Backup existing initramfs configuration
      copy:
        src: /etc/initramfs-tools/initramfs.conf
        dest: /etc/initramfs-tools/initramfs.conf.backup
        remote_src: yes

    - name: Configure initramfs with MODULES=dep
      lineinfile:
        path: /etc/initramfs-tools/initramfs.conf
        regexp: '^MODULES='
        line: 'MODULES=dep'
        backup: yes

    - name: Configure initramfs compression to xz
      lineinfile:
        path: /etc/initramfs-tools/initramfs.conf
        regexp: '^COMPRESS='
        line: 'COMPRESS=xz'

    - name: Ensure NVME modules are included in initramfs
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: yes
      loop:
        - nvme
        - nvme_core
        - nvme-pci

    - name: Remove old initramfs for new kernel
      file:
        path: "/boot/initrd.img-{{ kernel_version }}"
        state: absent
      ignore_errors: yes

    - name: Rebuild initramfs with optimized settings
      command: update-initramfs -c -k {{ kernel_version }}
      register: initramfs_build
      failed_when:
        - initramfs_build.rc != 0
        - "'No space left on device' not in initramfs_build.stderr"

    - name: Display initramfs size for verification
      stat:
        path: "/boot/initrd.img-{{ kernel_version }}"
      register: initramfs_stat

    - name: Show initramfs size (should be < 100MB for servers)
      debug:
        msg:
          - "Initramfs size: {{ (initramfs_stat.stat.size / 1048576) | round(2) }} MB"
          - "Expected size with MODULES=dep: 30-80 MB"

    - name: Warn if initramfs is too large
      debug:
        msg: "WARNING: Initramfs is {{ (initramfs_stat.stat.size / 1048576) | round(2) }} MB - may cause boot issues!"
      when: (initramfs_stat.stat.size / 1048576) > 150
      notify: Update Grub

  handlers:
    - name: Update Grub
      command: update-grub
      when: ansible_os_family == "Debian"
